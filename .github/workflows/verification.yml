name: Vérification

# Contrôle chaque proposition de changement et chaque envoi sur main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run validate
      - run: npm run build
