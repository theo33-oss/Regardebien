name: Collecte RSS

# Heure de Paris : 7h, 12h, 17h. GitHub planifie en UTC : on lance aux deux heures
# possibles (été et hiver), et le script ne fait rien si l'heure de Paris ne convient pas.
on:
  schedule:
    - cron: '5 5,6 * * *'
    - cron: '5 10,11 * * *'
    - cron: '5 15,16 * * *'
  workflow_dispatch:
    inputs:
      creneau:
        description: 'Créneau à forcer (07h, 12h ou 17h). Vide : le créneau le plus proche (07h par défaut).'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Collecte
        run: |
          if [ -n "${{ inputs.creneau }}" ]; then
            npm run collect -- --creneau "${{ inputs.creneau }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            npm run collect -- --auto
          else
            npm run collect
          fi
      - run: npm run index
      - run: npm run validate
      - name: Enregistrement
        run: |
          git config user.name "cartouche-bot"
          git config user.email "cartouche-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Collecte automatique" && git pull --rebase && git push)
