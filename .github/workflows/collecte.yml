name: Collecte RSS

# Heure de Paris : 7h, 12h, 17h. GitHub planifie en UTC : on lance aux deux heures
# possibles (été et hiver) ; le script ne refait pas un créneau déjà collecté.
on:
  schedule:
    - cron: '5 5,6 * * *'
    - cron: '5 10,11 * * *'
    - cron: '5 15,16 * * *'
  workflow_dispatch:
    inputs:
      creneau:
        description: 'Créneau à forcer (07h, 12h ou 17h). Vide : selon l’heure de Paris.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: ecriture-main
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Collecte
        run: |
          if [ -n "${{ inputs.creneau }}" ]; then
            npm run collect -- --creneau "${{ inputs.creneau }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            npm run collect -- --auto
          else
            npm run collect
          fi
      - name: Enregistrement
        run: |
          NOUVEAUX=$(git status --porcelain data/raw | awk '{print $2}')
          if [ -z "$NOUVEAUX" ]; then
            echo "Aucune nouvelle collecte, rien à enregistrer."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/collecte"
          cp $NOUVEAUX "$RUNNER_TEMP/collecte/"
          git config user.name "cartouche-bot"
          git config user.email "cartouche-bot@users.noreply.github.com"
          # On repart de la dernière version de main à chaque essai : jamais de conflit,
          # même si l'édition de 18 h a été poussée entre-temps. data/index.json est régénéré.
          export GH_TOKEN="${{ github.token }}"
          for essai in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP"/collecte/* data/raw/
            npm run index
            git add data
            git commit -q -m "Collecte $(basename $NOUVEAUX .json)"
            if git push -q origin HEAD:main; then
              # Un enregistrement fait par un workflow ne lance pas la mise en ligne : on la demande.
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            sleep 15
          done
          echo "Échec de l'enregistrement après 3 essais."
          exit 1
